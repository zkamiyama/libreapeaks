[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "libreapeaks"
version = "0.1.0"
requires-python = ">=3.10"
description = "REAPER .ReaPeaks core with PyO3 bindings"
license = { text = "MIT" }

[tool.maturin]
features = ["python", "strict-wdl"]
module-name = "reapeaks"
