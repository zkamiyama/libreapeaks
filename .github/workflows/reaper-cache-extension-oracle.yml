name: reaper-cache-extension-oracle

on:
  push:
    paths:
      - '.github/workflows/reaper-cache-extension-oracle.yml'
      - 'tools/reaper_oracle/cache_extension_oracle.py'
      - 'tools/reaper_oracle/cache_extension_oracle_fixed.py'
      - 'tools/reaper_oracle/cache_read_matrix.py'
      - 'tools/reaper_oracle/cache_read_matrix_fixed.py'
      - 'tools/reaper_oracle/cache_read_probe.lua'
      - 'tools/reaper_oracle/build_one.lua'
      - 'tools/reaper_oracle/fresh_process.py'
  pull_request:
    paths:
      - '.github/workflows/reaper-cache-extension-oracle.yml'
      - 'tools/reaper_oracle/cache_extension_oracle.py'
      - 'tools/reaper_oracle/cache_extension_oracle_fixed.py'
      - 'tools/reaper_oracle/cache_read_matrix.py'
      - 'tools/reaper_oracle/cache_read_matrix_fixed.py'
      - 'tools/reaper_oracle/cache_read_probe.lua'
      - 'tools/reaper_oracle/build_one.lua'
      - 'tools/reaper_oracle/fresh_process.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reaper-cache-extension-oracle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install REAPER runtime
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Download pinned REAPER 7.79 Linux x86_64
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/reaper-cache-extension
          mkdir -p "$root/reaper" "$root/oracle/results"
          curl -fL --retry 3 \
            https://www.reaper.fm/files/7.x/reaper779_linux_x86_64.tar.xz \
            -o "$root/reaper779_linux_x86_64.tar.xz"
          echo 'a420b47fc5a1bef2ba6ecbf4937bb67b094333f0daa318dfe702d5fcdaa38846  /tmp/reaper-cache-extension/reaper779_linux_x86_64.tar.xz' | sha256sum -c -
          tar -xJf "$root/reaper779_linux_x86_64.tar.xz" -C "$root/reaper"
          REAPER_BIN="$(find "$root/reaper" -type f -name reaper -perm -111 | head -1)"
          test -n "$REAPER_BIN"
          echo "REAPER_BIN=$REAPER_BIN" >> "$GITHUB_ENV"
      - name: Validate oracle syntax
        run: python3 -m py_compile tools/reaper_oracle/cache_extension_oracle.py tools/reaper_oracle/cache_extension_oracle_fixed.py tools/reaper_oracle/cache_read_matrix.py tools/reaper_oracle/cache_read_matrix_fixed.py
      - name: Start Xvfb
        shell: bash
        run: |
          Xvfb :96 -screen 0 1280x720x24 -nolisten tcp >/tmp/reaper-cache-extension/xvfb.log 2>&1 &
          echo $! >/tmp/reaper-cache-extension/xvfb.pid
      - name: Probe extended and malformed caches
        env:
          DISPLAY: ':96'
        run: python3 tools/reaper_oracle/cache_extension_oracle_fixed.py /tmp/reaper-cache-extension/oracle "$REAPER_BIN" --display :96 --timeout 30
      - name: Force waveform and spectral reads through accepted caches
        env:
          DISPLAY: ':96'
        run: python3 tools/reaper_oracle/cache_read_matrix_fixed.py /tmp/reaper-cache-extension/oracle "$REAPER_BIN" --display :96 --timeout 20
      - name: Publish evidence summary
        if: always()
        shell: bash
        run: |
          report=/tmp/reaper-cache-extension/oracle/results/cache-extension-oracle.json
          reads=/tmp/reaper-cache-extension/oracle/results/cache-read-matrix.json
          if [ -f "$report" ]; then
            echo '## REAPER cache extension oracle' >> "$GITHUB_STEP_SUMMARY"
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          p='/tmp/reaper-cache-extension/oracle/results/cache-extension-oracle.json'
          d=json.load(open(p))
          print(f"baseline: {d['baseline']['magic']}, layers={d['baseline']['layer_count']}, size={d['baseline']['size']}")
          print('')
          print('| case | classification | begin | bytes |')
          print('|---|---|---:|---:|')
          for c in d['cases']:
              print(f"| {c['name']} | {c['classification']} | {c['begin']} | {c['input_size']}→{c['output_size']} |")
          PY
          fi
          if [ -f "$reads" ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '## Forced peak reads' >> "$GITHUB_STEP_SUMMARY"
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          p='/tmp/reaper-cache-extension/oracle/results/cache-read-matrix.json'
          d=json.load(open(p))
          print('| case | read ok | same as control | cache unchanged |')
          print('|---|---:|---:|---:|')
          for c in d['cases']:
              print(f"| {c['name']} | {c['read_ok']} | {c['read_signature_equals_control']} | {c['cache_unchanged']} |")
          PY
          fi
      - name: Stop Xvfb
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/reaper-cache-extension/xvfb.pid ]; then
            kill "$(cat /tmp/reaper-cache-extension/xvfb.pid)" 2>/dev/null || true
          fi
      - name: Upload oracle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reaper-cache-extension-oracle-${{ github.sha }}
          path: |
            /tmp/reaper-cache-extension/oracle/results
            /tmp/reaper-cache-extension/xvfb.log
          if-no-files-found: warn
          retention-days: 30
