name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: check formatting without modifying sources
        run: cargo fmt --all -- --check
      - name: normal Rust tests
        run: cargo test --locked --all-targets
      - name: strict WDL golden tests (release math)
        run: cargo test --locked --release --all-targets --features strict-wdl
      - name: compile the complete feature matrix
        run: cargo check --locked --all-targets --all-features
      - name: fresh-process spectral corpus exactness gate
        shell: bash
        run: |
          set -o pipefail
          output="$(cargo test --locked --release --test spectral_corpus_diagnostic --features strict-wdl -- --nocapture 2>&1)"
          printf '%s\n' "$output"
          grep -Fq 'SPECTRAL_CORPUS summary cases=188 oracle_points=10112 exact_cases=188 exact_points=10112 count_mismatch=0 hash_mismatch=0' <<<"$output"
      - name: clippy without strict WDL
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: clippy with every feature
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: assert builds did not modify tracked sources
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
          git submodule foreach --recursive '
            git diff --exit-code
            test -z "$(git status --porcelain --untracked-files=no)"
          '

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: validate Python helper/demo syntax
        run: |
          python -m py_compile \
            tools/reaper_oracle/run_fresh.py \
            examples/player_common.py \
            examples/pyside6_views.py \
            examples/pyside6_player.py \
            examples/web_player/server.py \
            tests/python/test_player_common.py
      - name: validate browser demo JavaScript syntax
        run: node --check examples/web_player/app.js
      - name: web player gesture regression tests
        run: node --test examples/web_player/interaction_math.test.mjs
      - run: python -m pip install --upgrade pip maturin
      - name: build Python wheel
        run: maturin build --release --out dist
      - name: install Python wheel
        shell: bash
        run: python -m pip install dist/*.whl
      - name: Python player/cache regression tests
        run: python -m unittest discover -s tests/python -v
