name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: format working tree
        run: cargo fmt --all
      - name: pure Rust tests
        run: cargo test --all-targets
      - name: strict WDL golden tests (release math)
        run: cargo test --release --all-targets --features strict-wdl
      - name: fresh-process spectral corpus diagnostic
        run: cargo test --release --test spectral_corpus_diagnostic --features strict-wdl -- --nocapture
      - name: clippy
        run: cargo clippy --all-targets --features strict-wdl -- -D warnings

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip maturin
      - run: maturin build --release
