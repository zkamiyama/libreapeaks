name: Temporary format optimize branch

on:
  push:
    branches:
      - optimize/byte-identical-analysis

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize/byte-identical-analysis
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply compile fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for name in ["src/spectrogram_generate.rs", "src/spectrogram_generate_f32.rs"]:
              path = Path(name)
              text = path.read_text()
              text = text.replace(
                  "vec![SpectrogramFrame::default(); first_capacity]",
                  "vec![SpectrogramFrame { bins: [0u16; SPECTROGRAM_BINS] }; first_capacity]",
              )
              text = text.replace(
                  "vec![SpectrogramFrame::default(); capacity]",
                  "vec![SpectrogramFrame { bins: [0u16; SPECTROGRAM_BINS] }; capacity]",
              )
              path.write_text(text)

          path = Path("src/generate.rs")
          text = path.read_text().replace(
              "let mut layers = if parallel_analysis_worthwhile",
              "let layers = if parallel_analysis_worthwhile",
          )
          path.write_text(text)
          PY
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Commit fixes and formatting
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix optimization compile errors"
          git push origin HEAD:optimize/byte-identical-analysis
