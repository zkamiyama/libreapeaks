name: rust-hardening-materialize-v2

on:
  push:
    branches: [hardening-reapeaks-cache-ffmpeg]
    paths:
      - '.github/workflows/rust-hardening-materialize-v2.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply the staged hardening with whitespace-tolerant replacements
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          yaml = Path('.github/workflows/rust-hardening-materialize.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = yaml.index(marker) + len(marker)
          end = yaml.index("\n          PY\n", start)
          block = yaml[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )

          a = script.index('def replace_once(')
          b = script.index('\ndef replace_section(', a)
          robust = r'''def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old in text:
                  p.write_text(text.replace(old, new, 1))
                  return
              parts = re.split(r'(\s+)', old)
              pattern = ''.join(r'\s+' if part.isspace() else re.escape(part) for part in parts)
              updated, count = re.subn(pattern, lambda _m: new, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f'flexible marker not found in {path}: {old[:80]!r}')
              p.write_text(updated)
          '''
          script = script[:a] + robust + script[b:]
          exec(compile(script, '<rust-hardening-materialize>', 'exec'), {'Path': Path, 're': re})
          PY
          cargo fmt --all
      - name: Pure Rust adversarial and regression tests
        run: cargo test --all-targets
      - name: Strict WDL full regression suite
        run: cargo test --release --all-targets --features strict-wdl
      - name: Clippy hard gate
        run: cargo clippy --all-targets --features strict-wdl -- -D warnings
      - name: Commit only after every Rust gate passes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/rust-hardening-materialize.yml
          rm -f .github/workflows/rust-hardening-materialize-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden parser generator pyramid and FFI boundaries'
          git push origin HEAD:hardening-reapeaks-cache-ffmpeg
