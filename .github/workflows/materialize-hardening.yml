name: materialize-hardening

on:
  push:
    branches: [hardening-reapeaks-cache-ffmpeg]
    paths:
      - '.github/hardening-payload/**'
      - '.github/workflows/materialize-hardening.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize verified Python hardening
        shell: bash
        run: |
          set -euo pipefail
          decode() {
            local src="$1" dst="$2"
            mkdir -p "$(dirname "$dst")"
            base64 -d "$src" | gzip -d > "$dst"
          }
          decode .github/hardening-payload/player_common.py.gz.b64 examples/player_common.py
          decode .github/hardening-payload/pyside6_player.py.gz.b64 examples/pyside6_player.py
          decode .github/hardening-payload/web_server.py.gz.b64 examples/web_player/server.py
          decode .github/hardening-payload/test_player_common.py.gz.b64 tests/python/test_player_common.py

          python -m py_compile \
            examples/player_common.py \
            examples/pyside6_player.py \
            examples/web_player/server.py \
            tests/python/test_player_common.py

          rm -rf .github/hardening-payload
          rm -f .github/workflows/materialize-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden demo peak cache and expose FFmpeg decoding'
          git push origin HEAD:hardening-reapeaks-cache-ffmpeg
