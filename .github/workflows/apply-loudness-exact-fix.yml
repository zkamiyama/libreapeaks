name: apply-loudness-exact-fix

on:
  push:
    branches:
      - hardening-reapeaks-cache-ffmpeg
    paths:
      - '.github/workflows/apply-loudness-exact-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Materialize verified fix as one commit
        shell: bash
        env:
          PAYLOAD_SHA256: c0657bef442117cdbe8d2ae52179a90e0110175ef29110ce5b6815f480724fd9
          PAYLOAD_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PAYLOAD_B64" | base64 -d > /tmp/loudness-fix.tar.gz
          printf '%s  %s\n' "$PAYLOAD_SHA256" /tmp/loudness-fix.tar.gz | sha256sum -c -
          expected=$'src/loudness.rs\ntests/strict_wdl_sanitizer_harness.cpp\n.github/workflows/strict-wdl-sanitizers.yml\n.github/workflows/strict-wdl-thread-sanitizer.yml\n.github/workflows/reaper-ffmpeg-byte-identical.yml'
          actual="$(tar -tzf /tmp/loudness-fix.tar.gz)"
          test "$actual" = "$expected"
          tar -xzf /tmp/loudness-fix.tar.gz -C .
          rm -f .github/workflows/repo-snapshot.yml
          rm -f .github/workflows/apply-loudness-exact-fix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'no changes to commit' >&2; exit 1; }
          git commit -m 'match REAPER loudness accumulation exactly'
          git push origin HEAD:hardening-reapeaks-cache-ffmpeg
