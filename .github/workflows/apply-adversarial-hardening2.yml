name: apply-adversarial-hardening2

on:
  push:
    branches:
      - adversarial-oracle-hardening-2
    paths:
      - '.github/workflows/apply-adversarial-hardening2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adversarial-oracle-hardening-2
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply hardening fixes and validate
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_adversarial_hardening2.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --all-targets --all-features
          cargo clippy --all-targets --all-features -- -D warnings
          python -m py_compile examples/reaper_config.py tests/python/test_reaper_config_adversarial.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/reaper_config.py src/ffi.rs include/reapeaks.h tests/adversarial_properties.rs tests/c_api_adversarial.rs tests/python/test_reaper_config_adversarial.py
          git commit -m 'harden adversarial boundaries and restore C division API'
          git push origin HEAD:adversarial-oracle-hardening-2
