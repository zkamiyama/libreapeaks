name: rust-hardening-materialize-v3

on:
  push:
    branches: [hardening-reapeaks-cache-ffmpeg]
    paths:
      - '.github/workflows/rust-hardening-materialize-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-hardening-materialize-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply staged hardening with robust patch adapters
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          yaml = Path('.github/workflows/rust-hardening-materialize.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = yaml.index(marker) + len(marker)
          end = yaml.index("\n          PY\n", start)
          block = yaml[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )

          a = script.index('def replace_once(')
          b = script.index('\ndef replace_section(', a)
          c = script.index('\n\n# generate.rs:', b)
          adapters = r'''def _flex_find(text, marker, start=0):
              pos = text.find(marker, start)
              if pos >= 0:
                  return pos, len(marker)
              parts = re.split(r'(\s+)', marker)
              pattern = ''.join(r'\s+' if part.isspace() else re.escape(part) for part in parts)
              match = re.search(pattern, text[start:], flags=re.MULTILINE)
              if match is None:
                  return -1, 0
              return start + match.start(), match.end() - match.start()

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              pos, size = _flex_find(text, old)
              if pos < 0:
                  raise SystemExit(f'flexible marker not found in {path}: {old[:80]!r}')
              p.write_text(text[:pos] + new + text[pos + size:])

          def replace_section(path, start, end, new):
              p = Path(path)
              text = p.read_text()
              a, _ = _flex_find(text, start)
              if a < 0:
                  raise SystemExit(f'start marker not found in {path}: {start!r}')
              b, _ = _flex_find(text, end, a)
              if b < 0:
                  raise SystemExit(f'end marker not found in {path}: {end!r}')
              if end.startswith('\n}\n'):
                  close_len = len('\n}\n')
                  p.write_text(text[:a] + new + text[b + close_len:])
              else:
                  p.write_text(text[:a] + new + text[b:])
          '''
          script = script[:a] + adapters + script[c:]
          exec(compile(script, '<rust-hardening-materialize>', 'exec'), {'Path': Path, 're': re})
          PY
          cargo fmt --all
      - name: Pure Rust adversarial and regression tests
        run: cargo test --all-targets
      - name: Strict WDL full regression suite
        run: cargo test --release --all-targets --features strict-wdl
      - name: Clippy hard gate
        run: cargo clippy --all-targets --features strict-wdl -- -D warnings
      - name: Export validated repository changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/rust-hardening-materialize.yml
          rm -f .github/workflows/rust-hardening-materialize-v2.yml
          rm -f .github/workflows/rust-hardening-materialize-v3.yml
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import subprocess
          import tarfile

          def lines(*args):
              out = subprocess.check_output(['git', *args], text=True)
              return [line for line in out.splitlines() if line]

          changed = lines('diff', '--name-only', '--diff-filter=ACMRTUXB')
          untracked = lines('ls-files', '--others', '--exclude-standard')
          deleted = lines('diff', '--name-only', '--diff-filter=D')
          files = sorted(set(changed + untracked) - set(deleted))
          manifest = {
              'base_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'files': [],
              'deleted': sorted(set(deleted)),
          }
          bundle = Path('validated-hardening-tree.tar.gz')
          with tarfile.open(bundle, 'w:gz') as archive:
              for name in files:
                  path = Path(name)
                  data = path.read_bytes()
                  manifest['files'].append({
                      'path': name,
                      'size': len(data),
                      'sha256': hashlib.sha256(data).hexdigest(),
                  })
                  archive.add(path, arcname=name, recursive=False)
              payload = json.dumps(manifest, indent=2, sort_keys=True).encode()
              info = tarfile.TarInfo('validated-manifest.json')
              info.size = len(payload)
              archive.addfile(info, __import__('io').BytesIO(payload))
          Path('validated-manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          subprocess.run(['git', 'status', '--short'], check=True, stdout=Path('validated-status.txt').open('w'))
          subprocess.run(['git', 'diff', '--stat'], check=True, stdout=Path('validated-diffstat.txt').open('w'))
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY
      - name: Create validated Git commit object without moving a ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.request

          token = os.environ['GH_TOKEN']
          repository = os.environ['GITHUB_REPOSITORY']
          base_sha = os.environ['GITHUB_SHA']
          api_root = f'https://api.github.com/repos/{repository}'

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(
                  api_root + path,
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  body = error.read().decode(errors='replace')
                  raise SystemExit(f'GitHub API {method} {path} failed: {error.code}: {body}')

          manifest = json.loads(Path('validated-manifest.json').read_text())
          if manifest['base_sha'] != base_sha:
              raise SystemExit(
                  f"manifest base {manifest['base_sha']} does not match workflow SHA {base_sha}"
              )

          tree_entries = []
          for item in manifest['files']:
              path = Path(item['path'])
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if len(data) != item['size'] or digest != item['sha256']:
                  raise SystemExit(f'manifest mismatch for {item["path"]}')
              blob = api('POST', '/git/blobs', {
                  'content': base64.b64encode(data).decode(),
                  'encoding': 'base64',
              })
              stage = subprocess.run(
                  ['git', 'ls-files', '-s', '--', item['path']],
                  check=True,
                  text=True,
                  capture_output=True,
              ).stdout.strip()
              mode = stage.split()[0] if stage else '100644'
              tree_entries.append({
                  'path': item['path'],
                  'mode': mode,
                  'type': 'blob',
                  'sha': blob['sha'],
              })

          for path in manifest['deleted']:
              tree_entries.append({
                  'path': path,
                  'mode': '100644',
                  'type': 'blob',
                  'sha': None,
              })

          base_tree = subprocess.check_output(
              ['git', 'rev-parse', f'{base_sha}^{{tree}}'], text=True
          ).strip()
          tree = api('POST', '/git/trees', {
              'base_tree': base_tree,
              'tree': tree_entries,
          })
          commit = api('POST', '/git/commits', {
              'message': 'Harden parser generator pyramid and FFI boundaries',
              'tree': tree['sha'],
              'parents': [base_sha],
          })
          Path('validated-commit-sha.txt').write_text(commit['sha'] + '\n')
          print(f"validated commit object: {commit['sha']}")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Validated commit object: `{commit['sha']}`\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: validated-hardening-tree-${{ github.sha }}
          path: |
            validated-hardening-tree.tar.gz
            validated-manifest.json
            validated-status.txt
            validated-diffstat.txt
            validated-commit-sha.txt
          if-no-files-found: error
          retention-days: 7
