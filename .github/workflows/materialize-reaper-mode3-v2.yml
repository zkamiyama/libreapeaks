name: materialize-reaper-mode3-v2

on:
  push:
    branches: [hardening-reapeaks-cache-ffmpeg]
    paths:
      - '.github/workflows/materialize-reaper-mode3-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-reaper-mode3-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Reassemble and apply staged mode-3 patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('.github/patches')
          parts = [(root / f'reaper-mode3.part{i:02}.b64').read_text() for i in range(9)]
          expected = [
              '8b07fb36fee959aa077ef66e18ecb746a78190357cb4ec2350ced590fef6e91e',
              '3820b3e58337c4b76f417fcf60aa907b85c8303d63a08e3fbf6e4cd96a3564b9',
              '450b6b9f51eabf784908ca12b93969e252bc2f00bec5c3be7bdedbc0afe078d7',
              'a72d5fa6a2188d65d941a13fe7c452c555a1ba47da52ebefabd79ff0ced4ec25',
              'e85edc07bc4a50d9a86eef67ed2f076c39631691d751012f1595a63a37b8500d',
              'd76e78731f2e539e8af5481a7157106deff249e1c9d2c56475643e4ea1368a28',
              '3085346a37ff8d04360728971e3c64eb8772e95117bf5fb75dedacce6d436a11',
              '31bde998b96da2208ee281737ebf33fcdab10d9b621d0caf4a8fbdcd8f792c8e',
              'e002b6ebc5c7bd2077bd0887cb6f55d9464a8b73ef00836da19909a6e924b846',
          ]

          def digest(text):
              return hashlib.sha256(text.encode()).hexdigest()

          if digest(parts[5]) != expected[5]:
              if len(parts[5]) != 1199:
                  raise SystemExit(f'unexpected part05 length: {len(parts[5])}')
              alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
              repaired = None
              for position in range(len(parts[5]) + 1):
                  for character in alphabet:
                      candidate = parts[5][:position] + character + parts[5][position:]
                      if digest(candidate) == expected[5]:
                          repaired = candidate
                          print(f'repaired part05 at offset {position} with {character!r}')
                          break
                  if repaired is not None:
                      break
              if repaired is None:
                  raise SystemExit('could not reconstruct the single missing part05 byte')
              parts[5] = repaired

          for index, (part, wanted) in enumerate(zip(parts, expected)):
              actual = digest(part)
              if actual != wanted:
                  raise SystemExit(f'part{index:02} hash mismatch: {actual} != {wanted}')
          combined = ''.join(parts)
          if len(combined) != 10696:
              raise SystemExit(f'combined length mismatch: {len(combined)}')
          Path('/tmp/reaper-mode3.patch.gz.b64').write_text(combined)
          PY
          base64 -d /tmp/reaper-mode3.patch.gz.b64 | gzip -dc > /tmp/reaper-mode3.patch
          echo '1d7fd2d6b7908c6605438a85e80b9bf3f752cede597ccd6c8745aec39a10c675  /tmp/reaper-mode3.patch' | sha256sum -c -
          git apply --check /tmp/reaper-mode3.patch
          git apply /tmp/reaper-mode3.patch
          cargo fmt --all
          git diff --check
      - name: REAPER loudness payload oracle
        run: cargo test --lib loudness::tests::reaper779_sine997_loudness_payload_is_byte_exact -- --exact
      - name: Pure Rust regression suite
        run: cargo test --all-targets
      - name: Strict WDL release regression suite
        run: cargo test --release --all-targets --features strict-wdl
      - name: Clippy hard gate
        run: cargo clippy --all-targets --features strict-wdl -- -D warnings
      - name: Create validated Git commit object
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .github/patches/reaper-mode3.patch.gz.b64
          rm -f .github/patches/reaper-mode3.part*.b64
          rm -f .github/workflows/materialize-reaper-mode3.yml
          rm -f .github/workflows/materialize-reaper-mode3-v2.yml
          git diff --stat | tee /tmp/validated-diffstat.txt
          git status --short | tee /tmp/validated-status.txt
          python - <<'PY'
          from pathlib import Path
          import base64
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          parent = os.environ['GITHUB_SHA']
          api_root = f'https://api.github.com/repos/{repository}'

          def api(method, path, payload):
              request = urllib.request.Request(
                  api_root + path,
                  data=json.dumps(payload).encode(),
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  raise SystemExit(
                      f'GitHub API {method} {path} failed: {error.code}: '
                      + error.read().decode(errors='replace')
                  )

          def lines(*args):
              return [line for line in subprocess.check_output(['git', *args], text=True).splitlines() if line]

          changed = lines('diff', '--name-only', '--diff-filter=ACMRTUXB')
          untracked = lines('ls-files', '--others', '--exclude-standard')
          deleted = lines('diff', '--name-only', '--diff-filter=D')
          files = sorted(set(changed + untracked) - set(deleted))
          entries = []
          for name in files:
              data = Path(name).read_bytes()
              blob = api('POST', '/git/blobs', {
                  'content': base64.b64encode(data).decode(),
                  'encoding': 'base64',
              })
              staged = subprocess.run(
                  ['git', 'ls-files', '-s', '--', name],
                  check=True,
                  text=True,
                  capture_output=True,
              ).stdout.strip()
              mode = staged.split()[0] if staged else '100644'
              entries.append({'path': name, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})
          for name in sorted(set(deleted)):
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None})

          base_tree = subprocess.check_output(['git', 'rev-parse', f'{parent}^{{tree}}'], text=True).strip()
          tree = api('POST', '/git/trees', {'base_tree': base_tree, 'tree': entries})
          commit = api('POST', '/git/commits', {
              'message': 'Implement REAPER mode-3 loudness and exact divisions',
              'tree': tree['sha'],
              'parents': [parent],
          })
          Path('/tmp/validated-commit-sha.txt').write_text(commit['sha'] + '\n')
          print(f"VALIDATED_COMMIT={commit['sha']}")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Validated mode-3 commit: `{commit['sha']}`\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: validated-reaper-mode3-${{ github.sha }}
          path: |
            /tmp/validated-commit-sha.txt
            /tmp/validated-diffstat.txt
            /tmp/validated-status.txt
          if-no-files-found: error
          retention-days: 7
