name: dev-snapshot

on:
  push:
    branches: [hardening-reapeaks-cache-ffmpeg]
    paths:
      - '.github/workflows/dev-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Reproduce pre-Clippy CI sequence
        shell: bash
        run: |
          set -euo pipefail
          cargo test --all-targets
          cargo test --release --all-targets --features strict-wdl
          cargo test --release --test spectral_corpus_diagnostic --features strict-wdl -- --nocapture
      - name: Package full source tree
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > /tmp/snapshot-commit.txt
          find examples -maxdepth 2 -type f -print | sort > /tmp/example-files.txt
          tar \
            --exclude='./.git' \
            --exclude='./target' \
            -czf /tmp/repo-snapshot.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: repo-snapshot-${{ github.sha }}
          path: |
            /tmp/repo-snapshot.tar.gz
            /tmp/snapshot-commit.txt
            /tmp/example-files.txt
          if-no-files-found: error
          retention-days: 3
