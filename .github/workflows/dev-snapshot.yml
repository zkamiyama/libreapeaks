name: dev-snapshot

on:
  push:
    branches: [hardening-reapeaks-cache-ffmpeg]
    paths:
      - '.github/workflows/dev-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Package full source tree
        shell: bash
        run: |
          set -euo pipefail
          # Snapshot the exact branch head used for central-cache reverse engineering.
          git rev-parse HEAD > /tmp/snapshot-commit.txt
          tar \
            --exclude='./.git' \
            -czf /tmp/repo-snapshot.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: repo-snapshot-${{ github.sha }}
          path: |
            /tmp/repo-snapshot.tar.gz
            /tmp/snapshot-commit.txt
          if-no-files-found: error
          retention-days: 3
