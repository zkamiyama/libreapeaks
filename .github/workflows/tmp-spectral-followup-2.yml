name: Temporary spectral follow-up 2 planar gate

on:
  push:
    branches:
      - optimize/spectral-followup-2
    paths:
      - ".github/workflows/tmp-spectral-followup-2.yml"

permissions:
  contents: write

jobs:
  optimize-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize/spectral-followup-2
          submodules: recursive
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply planar spectral ring buffer
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/spectral.rs")
          text = path.read_text()

          # Streaming writer: keep each channel's history contiguous so the FFT
          # gather no longer walks memory with a channel-count stride.
          start = text.index("    fn push_interleaved(&mut self, samples: &[f64]) -> bool {")
          end = text.index("\n    fn into_output", start)
          method = r'''    fn push_interleaved(&mut self, samples: &[f64]) -> bool {
              debug_assert_eq!(samples.len() % self.channels, 0);
              let nwin = self.window.len();
              for frame in samples.chunks_exact(self.channels) {
                  for (channel, &sample) in frame.iter().enumerate() {
                      self.ring[channel * nwin + self.write_pos] = sample as f32;
                  }
                  self.write_pos += 1;
                  if self.write_pos == nwin {
                      self.write_pos = 0;
                  }
                  self.phase += 1.0;
                  self.elapsed += 1;
                  while self.phase >= self.hop {
                      for channel in 0..self.channels {
                          let peak = analyze_channel(
                              &self.ring,
                              self.write_pos,
                              channel,
                              &self.window,
                              &mut self.previous[channel],
                              self.elapsed,
                          );
                          self.out.push(peak);
                      }
                      self.elapsed = 0;
                      self.phase -= self.hop;
                      if self
                          .expected
                          .is_some_and(|expected| self.out.len() / self.channels >= expected)
                      {
                          return true;
                      }
                  }
              }
              false
          }
          '''
          text = text[:start] + method + text[end:]

          # FFT gather now consumes a contiguous per-channel lane.
          start = text.index("#[inline]\nfn fill_fft_input(")
          end = text.index("\n#[inline]\nfn summarize_spectrum_magnitudes", start)
          fill = r'''#[inline]
          fn fill_fft_input(
              ring: &[f32],
              write_pos: usize,
              channel: usize,
              window: &[f32],
          ) -> [f64; FFT_N] {
              let nwin = window.len();
              let lane_start = channel * nwin;
              let lane = &ring[lane_start..lane_start + nwin];
              let mut fft_in = [0.0f64; FFT_N];
              if nwin == FFT_N {
                  let mut i = 0usize;
                  for &sample in &lane[write_pos..] {
                      // Preserve REAPER's scalar f32 multiply before promotion.
                      let product = sample * window[i];
                      fft_in[i] += product as f64;
                      i += 1;
                  }
                  for &sample in &lane[..write_pos] {
                      let product = sample * window[i];
                      fft_in[i] += product as f64;
                      i += 1;
                  }
              } else {
                  for i in 0..nwin {
                      let rf = (write_pos + i) % nwin;
                      let product = lane[rf] * window[i];
                      fft_in[i & (FFT_N - 1)] += product as f64;
                  }
              }
              fft_in
          }
          '''
          text = text[:start] + fill + text[end:]

          # analyze_channel no longer needs the channel count for ring indexing.
          start = text.index("fn analyze_channel(")
          end = text.index("\nfn analyze_resampled_spectral(", start)
          section = text[start:end]
          old = "    channels: usize,\n    channel: usize,"
          if old not in section:
              raise SystemExit("analyze_channel signature fragment not found")
          section = section.replace(old, "    channel: usize,", 1)
          old = "fill_fft_input(ring, write_pos, channels, channel, window)"
          if section.count(old) != 2:
              raise SystemExit(f"expected two fill calls, got {section.count(old)}")
          section = section.replace(old, "fill_fft_input(ring, write_pos, channel, window)")
          text = text[:start] + section + text[end:]

          # Staged analyzer uses the same planar layout, preserving sample order.
          old = """        for c in 0..channels {\n            ring[write_pos * channels + c] = resampled[f * channels + c] as f32;\n        }\n"""
          new = """        for c in 0..channels {\n            ring[c * nwin + write_pos] = resampled[f * channels + c] as f32;\n        }\n"""
          if old not in text:
              raise SystemExit("staged ring write not found")
          text = text.replace(old, new, 1)

          old = """                let p = analyze_channel(\n                    &ring,\n                    write_pos,\n                    channels,\n                    c,\n"""
          new = """                let p = analyze_channel(\n                    &ring,\n                    write_pos,\n                    c,\n"""
          if old not in text:
              raise SystemExit("staged analyze call not found")
          text = text.replace(old, new, 1)

          # Dedicated equivalence test: planar gather must reproduce the old
          # interleaved indexing bit-for-bit for every tested write position.
          start = text.index("#[cfg(test)]\nmod spectral_fft_input_fast_path_tests {")
          end = text.index("\n#[cfg(test)]\nmod spectral_magnitude_summary_tests", start)
          tests = r'''#[cfg(test)]
          mod spectral_fft_input_fast_path_tests {
              use super::*;

              fn reference_interleaved_fft_input(
                  ring: &[f32],
                  write_pos: usize,
                  channels: usize,
                  channel: usize,
                  window: &[f32],
              ) -> [f64; FFT_N] {
                  let nwin = window.len();
                  let mut fft_in = [0.0f64; FFT_N];
                  for i in 0..nwin {
                      let rf = (write_pos + i) % nwin;
                      let sample = ring[rf * channels + channel];
                      let product = sample * window[i];
                      fft_in[i & (FFT_N - 1)] += product as f64;
                  }
                  fft_in
              }

              fn planarize(interleaved: &[f32], frames: usize, channels: usize) -> Vec<f32> {
                  let mut planar = vec![0.0f32; interleaved.len()];
                  for frame in 0..frames {
                      for channel in 0..channels {
                          planar[channel * frames + frame] = interleaved[frame * channels + channel];
                      }
                  }
                  planar
              }

              #[test]
              fn planar_modulo_free_1024_gather_is_bit_identical() {
                  let channels = 6usize;
                  let interleaved: Vec<f32> = (0..FFT_N * channels)
                      .map(|i| (((i * 37) % 20_003) as f32 - 10_001.0) / 10_003.0)
                      .collect();
                  let planar = planarize(&interleaved, FFT_N, channels);
                  let window: Vec<f32> = (0..FFT_N)
                      .map(|i| (((i * 53) % 4_093) as f32 + 1.0) / 4_096.0)
                      .collect();
                  for write_pos in [0usize, 1, 127, 511, 512, 777, 1023] {
                      for channel in 0..channels {
                          let fast = fill_fft_input(&planar, write_pos, channel, &window);
                          let reference = reference_interleaved_fft_input(
                              &interleaved,
                              write_pos,
                              channels,
                              channel,
                              &window,
                          );
                          for (index, (&actual, &expected)) in
                              fast.iter().zip(reference.iter()).enumerate()
                          {
                              assert_eq!(
                                  actual.to_bits(),
                                  expected.to_bits(),
                                  "write_pos={write_pos} channel={channel} bin={index}"
                              );
                          }
                      }
                  }
              }
          }
          '''
          text = text[:start] + tests + text[end:]

          path.write_text(text)
          PY
          cargo fmt --all

      - name: Test default feature set
        run: cargo test --locked --all-targets
      - name: Test strict WDL feature set
        run: cargo test --locked --all-targets --features strict-wdl
      - name: Clippy default feature set
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy strict WDL
        run: cargo clippy --locked --all-targets --features strict-wdl -- -D warnings
      - name: Commit source optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/spectral.rs
          git diff --cached --quiet && exit 1
          git commit -m "Store spectral ring buffers per channel"
          git push origin HEAD:optimize/spectral-followup-2
