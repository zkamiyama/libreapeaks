name: Temporary spectral follow-up 2 benchmark

on:
  push:
    branches:
      - optimize/spectral-followup-2
    paths:
      - ".github/workflows/tmp-spectral-followup-2.yml"

permissions:
  contents: read

jobs:
  benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      BASELINE_SHA: 7693e4f6c261ffab227d61d86264ee5a2ce5edb2
    steps:
      - name: Checkout optimized branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: optimized
          submodules: recursive
          fetch-depth: 1
      - name: Checkout merged main baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASELINE_SHA }}
          path: baseline
          submodules: recursive
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - name: Use identical benchmark harness
        run: |
          mkdir -p baseline/examples
          cp optimized/examples/optimization_benchmark.rs baseline/examples/optimization_benchmark.rs
      - name: Build release strict-wdl binaries
        run: |
          cargo build --manifest-path baseline/Cargo.toml --locked --release --features strict-wdl --example optimization_benchmark
          cargo build --manifest-path optimized/Cargo.toml --locked --release --features strict-wdl --example optimization_benchmark
      - name: Benchmark spectral cases and verify byte identity
        run: |
          python3 - <<'PY'
          import json, math, os, statistics, subprocess
          from pathlib import Path

          cases = [
              "pcm16-spectral-48k-stereo-30s",
              "pcm16-spectrogram-48k-stereo-20s",
              "pcm16-spectrogram-96k-6ch-8s",
              "pcm24-spectral-96k-stereo-15s",
              "f32-spectrogram-48k-stereo-15s",
          ]
          binaries = {
              "baseline": Path("baseline/target/release/examples/optimization_benchmark"),
              "optimized": Path("optimized/target/release/examples/optimization_benchmark"),
          }
          samples = {c: {"baseline": [], "optimized": []} for c in cases}
          meta = {c: {} for c in cases}
          orders = (
              ("baseline", "optimized"),
              ("optimized", "baseline"),
              ("baseline", "optimized"),
              ("optimized", "baseline"),
          )
          for order in orders:
              for case in cases:
                  for label in order:
                      raw = subprocess.check_output([str(binaries[label]), case, "3"], text=True).strip()
                      result = json.loads(raw)
                      samples[case][label].extend(result["samples_ns"])
                      current = {"bytes": result["bytes"], "hash": result["hash"]}
                      if label in meta[case] and meta[case][label] != current:
                          raise SystemExit(f"nondeterministic output {case}/{label}")
                      meta[case][label] = current
          rows = []
          speedups = []
          for case in cases:
              if meta[case]["baseline"] != meta[case]["optimized"]:
                  raise SystemExit(f"byte identity failed {case}: {meta[case]}")
              b = statistics.median(samples[case]["baseline"])
              o = statistics.median(samples[case]["optimized"])
              s = b / o
              speedups.append(s)
              rows.append({
                  "case": case,
                  "baseline_median_ns": b,
                  "optimized_median_ns": o,
                  "speedup": s,
                  "bytes": meta[case]["baseline"]["bytes"],
                  "hash": meta[case]["baseline"]["hash"],
                  "baseline_samples_ns": samples[case]["baseline"],
                  "optimized_samples_ns": samples[case]["optimized"],
              })
          payload = {
              "baseline": os.environ["BASELINE_SHA"],
              "optimized": subprocess.check_output(["git", "-C", "optimized", "rev-parse", "HEAD"], text=True).strip(),
              "samples_per_side_per_case": 12,
              "geomean_speedup": math.exp(sum(math.log(x) for x in speedups) / len(speedups)),
              "cases": rows,
          }
          Path("phase-history-benchmark.json").write_text(json.dumps(payload, indent=2) + "\n")
          print(json.dumps(payload, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase-history-benchmark
          path: phase-history-benchmark.json
          retention-days: 7
