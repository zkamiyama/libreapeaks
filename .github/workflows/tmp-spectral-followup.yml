name: Temporary spectral follow-up implementation

on:
  push:
    branches:
      - optimize/spectral-followup
    paths:
      - ".github/workflows/tmp-spectral-followup.yml"

permissions:
  contents: write

jobs:
  implement-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize/spectral-followup
          submodules: recursive
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply step 2 - remove modulo from the 1024-sample FFT gather
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/spectral.rs")
          text = path.read_text()
          old = r'''fn analyze_channel(
              ring: &[f32],
              write_pos: usize,
              channels: usize,
              channel: usize,
              window: &[f32],
              previous: &[C32; HALF_BINS + 1],
              elapsed: usize,
          ) -> (SpectralPeak, [C32; HALF_BINS + 1]) {
              let nwin = window.len();
              let mut fft_in = [0.0f64; FFT_N];
              for i in 0..nwin {
                  let rf = (write_pos + i) % nwin;
                  let sample = ring[rf * channels + channel];
                  // REAPER 7.79 disassembly uses a scalar f32 multiply here, then
                  // promotes the result to double before accumulating the FFT input.
                  let product = sample * window[i];
                  fft_in[i & (FFT_N - 1)] += product as f64;
              }
          '''.replace('          ', '')
          new = r'''#[inline]
          fn fill_fft_input(
              ring: &[f32],
              write_pos: usize,
              channels: usize,
              channel: usize,
              window: &[f32],
          ) -> [f64; FFT_N] {
              let nwin = window.len();
              let mut fft_in = [0.0f64; FFT_N];
              if nwin == FFT_N {
                  let mut i = 0usize;
                  for rf in write_pos..FFT_N {
                      let sample = ring[rf * channels + channel];
                      // Preserve REAPER's scalar f32 multiply before promotion.
                      let product = sample * window[i];
                      fft_in[i] += product as f64;
                      i += 1;
                  }
                  for rf in 0..write_pos {
                      let sample = ring[rf * channels + channel];
                      let product = sample * window[i];
                      fft_in[i] += product as f64;
                      i += 1;
                  }
              } else {
                  for i in 0..nwin {
                      let rf = (write_pos + i) % nwin;
                      let sample = ring[rf * channels + channel];
                      let product = sample * window[i];
                      fft_in[i & (FFT_N - 1)] += product as f64;
                  }
              }
              fft_in
          }

          fn analyze_channel(
              ring: &[f32],
              write_pos: usize,
              channels: usize,
              channel: usize,
              window: &[f32],
              previous: &[C32; HALF_BINS + 1],
              elapsed: usize,
          ) -> (SpectralPeak, [C32; HALF_BINS + 1]) {
              let mut fft_in = fill_fft_input(ring, write_pos, channels, channel, window);
          '''.replace('          ', '')
          if old not in text:
              raise SystemExit("step2 production target not found")
          text = text.replace(old, new, 1)

          tests = r'''

          #[cfg(test)]
          mod spectral_fft_input_fast_path_tests {
              use super::*;

              fn reference_fft_input(
                  ring: &[f32],
                  write_pos: usize,
                  channels: usize,
                  channel: usize,
                  window: &[f32],
              ) -> [f64; FFT_N] {
                  let nwin = window.len();
                  let mut fft_in = [0.0f64; FFT_N];
                  for i in 0..nwin {
                      let rf = (write_pos + i) % nwin;
                      let sample = ring[rf * channels + channel];
                      let product = sample * window[i];
                      fft_in[i & (FFT_N - 1)] += product as f64;
                  }
                  fft_in
              }

              #[test]
              fn modulo_free_1024_gather_is_bit_identical() {
                  let channels = 6usize;
                  let ring: Vec<f32> = (0..FFT_N * channels)
                      .map(|i| (((i * 37) % 20_003) as f32 - 10_001.0) / 10_003.0)
                      .collect();
                  let window: Vec<f32> = (0..FFT_N)
                      .map(|i| (((i * 53) % 4_093) as f32 + 1.0) / 4_096.0)
                      .collect();
                  for write_pos in [0usize, 1, 127, 511, 512, 777, 1023] {
                      for channel in 0..channels {
                          let fast = fill_fft_input(
                              &ring,
                              write_pos,
                              channels,
                              channel,
                              &window,
                          );
                          let reference = reference_fft_input(
                              &ring,
                              write_pos,
                              channels,
                              channel,
                              &window,
                          );
                          for (index, (&actual, &expected)) in
                              fast.iter().zip(reference.iter()).enumerate()
                          {
                              assert_eq!(
                                  actual.to_bits(),
                                  expected.to_bits(),
                                  "write_pos={write_pos} channel={channel} bin={index}"
                              );
                          }
                      }
                  }
              }
          }
          '''.replace('          ', '')
          if 'mod spectral_fft_input_fast_path_tests' in text:
              raise SystemExit("step2 tests already present")
          path.write_text(text + tests)
          PY
          cargo fmt --all

      - name: Test default feature set
        run: cargo test --locked --all-targets

      - name: Test strict WDL feature set
        run: cargo test --locked --all-targets --features strict-wdl

      - name: Clippy strict WDL
        run: cargo clippy --locked --all-targets --features strict-wdl -- -D warnings

      - name: Commit step 2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/spectral.rs
          git commit -m "Avoid modulo in 1024-sample spectral FFT gather"
          git push origin HEAD:optimize/spectral-followup
