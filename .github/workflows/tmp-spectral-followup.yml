name: Temporary spectral follow-up benchmark

on:
  push:
    branches:
      - optimize/spectral-followup
    paths:
      - ".github/workflows/tmp-spectral-followup.yml"

permissions:
  contents: read

jobs:
  benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      BASELINE_SHA: 6d3a5006e66b52846b2007a795a163e257d33afa
    steps:
      - name: Checkout optimized branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: optimized
          submodules: recursive
          fetch-depth: 1

      - name: Checkout PR 28 merged baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASELINE_SHA }}
          path: baseline
          submodules: recursive
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable

      - name: Use identical benchmark harness
        run: |
          mkdir -p baseline/examples
          cp optimized/examples/optimization_benchmark.rs baseline/examples/optimization_benchmark.rs

      - name: Build release strict-wdl binaries
        run: |
          cargo build --manifest-path baseline/Cargo.toml --locked --release --features strict-wdl --example optimization_benchmark
          cargo build --manifest-path optimized/Cargo.toml --locked --release --features strict-wdl --example optimization_benchmark

      - name: Benchmark and verify byte identity
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import math
          import os
          import statistics
          import subprocess
          from pathlib import Path

          cases = [
              "pcm16-wave-48k-stereo-60s",
              "pcm16-spectral-48k-stereo-30s",
              "pcm16-spectrogram-48k-stereo-20s",
              "pcm16-spectrogram-96k-6ch-8s",
              "pcm24-spectral-96k-stereo-15s",
              "f32-spectrogram-48k-stereo-15s",
          ]
          binaries = {
              "baseline": Path("baseline/target/release/examples/optimization_benchmark"),
              "optimized": Path("optimized/target/release/examples/optimization_benchmark"),
          }
          samples = {case: {"baseline": [], "optimized": []} for case in cases}
          metadata = {case: {} for case in cases}

          # Four order-balanced passes, five timed generations per invocation.
          orders = (
              ("baseline", "optimized"),
              ("optimized", "baseline"),
              ("baseline", "optimized"),
              ("optimized", "baseline"),
          )
          for order in orders:
              for case in cases:
                  for label in order:
                      raw = subprocess.check_output(
                          [str(binaries[label]), case, "5"], text=True
                      ).strip()
                      result = json.loads(raw)
                      samples[case][label].extend(result["samples_ns"])
                      current = {"bytes": result["bytes"], "hash": result["hash"]}
                      previous = metadata[case].get(label)
                      if previous is not None and previous != current:
                          raise SystemExit(
                              f"nondeterministic metadata in {case}/{label}: "
                              f"previous={previous} current={current}"
                          )
                      metadata[case][label] = current

          rows = []
          speedups = []
          spectral_speedups = []
          for case in cases:
              if metadata[case]["baseline"] != metadata[case]["optimized"]:
                  raise SystemExit(
                      f"byte identity failed in {case}: baseline={metadata[case]['baseline']} "
                      f"optimized={metadata[case]['optimized']}"
                  )
              baseline_ns = statistics.median(samples[case]["baseline"])
              optimized_ns = statistics.median(samples[case]["optimized"])
              speedup = baseline_ns / optimized_ns
              speedups.append(speedup)
              if case != "pcm16-wave-48k-stereo-60s":
                  spectral_speedups.append(speedup)
              rows.append({
                  "case": case,
                  "baseline_median_ns": baseline_ns,
                  "optimized_median_ns": optimized_ns,
                  "speedup": speedup,
                  "bytes": metadata[case]["baseline"]["bytes"],
                  "hash": metadata[case]["baseline"]["hash"],
                  "baseline_samples_ns": samples[case]["baseline"],
                  "optimized_samples_ns": samples[case]["optimized"],
              })

          payload = {
              "baseline": os.environ["BASELINE_SHA"],
              "optimized": subprocess.check_output(
                  ["git", "-C", "optimized", "rev-parse", "HEAD"], text=True
              ).strip(),
              "samples_per_side_per_case": 20,
              "geomean_speedup_all_6": math.exp(
                  sum(math.log(x) for x in speedups) / len(speedups)
              ),
              "geomean_speedup_spectral_5": math.exp(
                  sum(math.log(x) for x in spectral_speedups) / len(spectral_speedups)
              ),
              "cases": rows,
          }
          Path("spectral-followup-benchmark.json").write_text(
              json.dumps(payload, indent=2) + "\n"
          )
          print(json.dumps(payload, indent=2))
          PY

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: spectral-followup-benchmark-validated
          path: spectral-followup-benchmark.json
          retention-days: 7
