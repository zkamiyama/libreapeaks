name: Temporary spectral follow-up Clippy fix

on:
  push:
    branches:
      - optimize/spectral-followup
    paths:
      - ".github/workflows/tmp-spectral-followup.yml"

permissions:
  contents: write

jobs:
  fix-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize/spectral-followup
          submodules: recursive
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Fix needless range loop without changing operation order
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/spectral.rs")
          text = path.read_text()
          start = text.index("fn summarize_spectrum_magnitudes(")
          end = text.index("\nfn analyze_channel(", start)
          section = text[start:end]
          old = "for k in 0..=HALF_BINS {"
          if section.count(old) != 1:
              raise SystemExit(f"expected one range loop in summary helper, found {section.count(old)}")
          section = section.replace(old, "for (k, bin) in spec.iter().enumerate() {", 1)
          section = section.replace("spec[k].re", "bin.re")
          section = section.replace("spec[k].im", "bin.im")
          text = text[:start] + section + text[end:]
          path.write_text(text)
          PY
          cargo fmt --all

      - name: Test default feature set
        run: cargo test --locked --all-targets

      - name: Test strict WDL feature set
        run: cargo test --locked --all-targets --features strict-wdl

      - name: Clippy default feature set
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Clippy strict WDL
        run: cargo clippy --locked --all-targets --features strict-wdl -- -D warnings

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/spectral.rs
          git commit -m "Satisfy spectral Clippy without changing order"
          git push origin HEAD:optimize/spectral-followup
