name: docs-consistency-audit

on:
  push:
    branches:
      - docs-artist-first-refresh
    paths:
      - '.github/workflows/docs-consistency-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation against current implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote
          import json
          import re

          root = Path('.').resolve()
          markdown = [Path('README.md'), *sorted(Path('docs').glob('*.md')), Path('examples/PLAYER_DEMOS.md')]
          link_re = re.compile(r'\[[^\]]*\]\(([^)]+)\)')
          failures = []

          for doc in markdown:
              text = doc.read_text(encoding='utf-8')
              for match in link_re.finditer(text):
                  href = match.group(1).strip().strip('<>')
                  if href.startswith(('http://', 'https://', 'mailto:', '#')):
                      continue
                  path_part = unquote(href.split('#', 1)[0])
                  if not path_part:
                      continue
                  target = (doc.parent / path_part).resolve()
                  try:
                      target.relative_to(root)
                  except ValueError:
                      failures.append(f'{doc}: local link escapes repository: {href}')
                      continue
                  if not target.exists():
                      failures.append(f'{doc}: missing local link target: {href}')

          summary = json.loads(Path('docs/validation-summary.json').read_text(encoding='utf-8'))
          assert summary['oracle'] == 'REAPER 7.79 x86_64 Linux'
          assert summary['whole_file_mode3']['ffmpeg_alac']['cases'] == 8
          assert summary['whole_file_mode3']['ffmpeg_alac']['exact_files'] == 8
          assert summary['whole_file_mode3']['adversarial']['cases'] == 16
          assert summary['whole_file_mode3']['adversarial']['exact_files'] == 16

          header = Path('include/reapeaks.h').read_text(encoding='utf-8')
          cabi = Path('docs/C_ABI.md').read_text(encoding='utf-8')
          functions = sorted(set(re.findall(r'\b(rpk_[A-Za-z0-9_]+)\s*\(', header)))
          missing = [name for name in functions if name not in cabi]
          if missing:
              failures.append('docs/C_ABI.md omits exported functions: ' + ', '.join(missing))

          python_src = Path('src/python.rs').read_text(encoding='utf-8')
          if 'generate_pcm16_mode3' in python_src or 'generate_f32_mode3' in python_src:
              failures.append('Python mode-3 assumption changed: update docs before merging')

          pyside = Path('examples/pyside6_player.py').read_text(encoding='utf-8')
          web = Path('examples/web_player/server.py').read_text(encoding='utf-8')
          central_doc = Path('docs/REAPER_CENTRAL_CACHE.md').read_text(encoding='utf-8')
          for cli_name, cli in [('PySide6', pyside), ('web', web)]:
              if '--reaper-ini' in cli or '--reaper-executable' in cli or 'private-central' in cli:
                  failures.append(f'{cli_name} CLI integration changed; re-audit central-cache docs')
              for expected in ('auto', 'sidecar', 'subdir', 'central', 'reaper'):
                  if f'"{expected}"' not in cli:
                      failures.append(f'{cli_name} CLI no longer exposes cache mode {expected}')
          central_lower = central_doc.lower()
          for required in ('current runnable demo cli wiring', '--cache-mode reaper', 'private sha-256'):
              if required not in central_lower:
                  failures.append(f'central-cache docs lost required clarification: {required}')

          adversarial = Path('.github/workflows/reaper-adversarial-oracle.yml').read_text(encoding='utf-8')
          adversarial_cases = len(re.findall(r"dict\(name='[^']+'", adversarial))
          if adversarial_cases != 16:
              failures.append(f'adversarial oracle case count changed: {adversarial_cases} != 16')

          ffmpeg = Path('.github/workflows/reaper-ffmpeg-byte-identical.yml').read_text(encoding='utf-8')
          for name in ('silence', 'sine_997', 'step', 'impulse', 'dc_tail', 'low_level', 'block_edge_impulse', 'alternating'):
              if f"'{name}'" not in ffmpeg:
                  failures.append(f'FFmpeg oracle case missing from workflow: {name}')

          combined = '\n'.join(path.read_text(encoding='utf-8') for path in markdown)
          stale_phrases = (
              "main remaining reverse-engineering work is outside that scope",
              "Other media formats can still be played, but need an existing `.reapeaks` cache",
          )
          for phrase in stale_phrases:
              if phrase in combined:
                  failures.append(f'stale documentation phrase remains: {phrase}')

          if failures:
              raise SystemExit('\n'.join(failures))

          print(f'DOCS_AUDIT_OK markdown_files={len(markdown)} c_abi_functions={len(functions)}')
          PY
