name: strict-wdl-boundary

on:
  push:
    branches:
      - main
      - hardening-reapeaks-cache-ffmpeg
  pull_request:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Formatting is read-only
        run: cargo fmt --all -- --check

      - name: Clippy without strict-WDL
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy with strict-WDL
        run: cargo clippy --all-targets --features strict-wdl -- -D warnings

      - name: Normal test suite
        run: cargo test --all-targets

      - name: Strict-WDL release test suite
        run: cargo test --release --all-targets --features strict-wdl

      - name: Assert build and tests left the source tree untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status" >&2
            echo "strict-WDL/build/test tooling mutated the source tree" >&2
            exit 1
          fi
