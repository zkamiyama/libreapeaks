name: materialize-hardening-fix

on:
  push:
    branches: [hardening-reapeaks-cache-ffmpeg]
    paths:
      - '.github/hardening-payload/fix-player-common.py.gz.b64'
      - '.github/workflows/materialize-hardening-fix.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize WAVE_FORMAT_EXTENSIBLE fix
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/hardening-payload/fix-player-common.py.gz.b64 | gzip -d > examples/player_common.py
          python -m py_compile \
            examples/player_common.py \
            examples/pyside6_player.py \
            examples/web_player/server.py \
            tests/python/test_player_common.py
          rm -rf .github/hardening-payload
          rm -f .github/workflows/materialize-hardening-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix WAVE_FORMAT_EXTENSIBLE GUID validation'
          git push origin HEAD:hardening-reapeaks-cache-ffmpeg
