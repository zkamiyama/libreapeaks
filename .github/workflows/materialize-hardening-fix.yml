name: materialize-hardening-fix

on:
  push:
    branches: [hardening-reapeaks-cache-ffmpeg]
    paths:
      - '.github/workflows/materialize-hardening-fix.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix WAVE_FORMAT_EXTENSIBLE GUID validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('examples/player_common.py')
          text = path.read_text(encoding='utf-8')
          old = 'guid_tail = bytes.fromhex("00001000800000aa00389b71")'
          new = 'guid_tail = bytes.fromhex("000000001000800000aa00389b71")'
          if old not in text:
              raise SystemExit('expected old GUID tail not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile \
            examples/player_common.py \
            examples/pyside6_player.py \
            examples/web_player/server.py \
            tests/python/test_player_common.py
          rm -rf .github/hardening-payload
          rm -f .github/workflows/materialize-hardening-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix WAVE_FORMAT_EXTENSIBLE GUID validation'
          git push origin HEAD:hardening-reapeaks-cache-ffmpeg
