name: autofix-clippy

on:
  push:
    branches:
      - hardening-reapeaks-cache-ffmpeg

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply machine-applicable Clippy fixes
        run: |
          cargo clippy --fix --all-targets --features strict-wdl --allow-dirty --allow-staged -- -D warnings
          cargo fmt --all

      - name: Reject unexpected autofix targets
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            case "$path" in
              *.rs|Cargo.toml|Cargo.lock) ;;
              *)
                echo "unexpected file modified by Clippy/rustfmt: $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only)

      - name: Create clean candidate commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*.rs' Cargo.toml Cargo.lock
          git rm .github/workflows/autofix-clippy.yml
          if git diff --cached --quiet; then
            echo "No changes were required" >&2
            exit 1
          fi
          git commit -m "Resolve Clippy errors and verify strict-WDL boundaries"

      - name: Verify formatting and all Clippy targets
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features strict-wdl -- -D warnings

      - name: Verify normal and strict-WDL tests
        run: |
          cargo test --all-targets
          cargo test --release --all-targets --features strict-wdl

      - name: Ensure builds do not mutate the source tree
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status" >&2
            echo "build/test tooling mutated the source tree" >&2
            exit 1
          fi

      - name: Push verified fixes
        shell: bash
        run: git push origin "HEAD:${GITHUB_REF_NAME}"
