name: strict-wdl-denormal-mode-oracle

on:
  push:
    branches:
      - hardening-reapeaks-cache-ffmpeg
    paths:
      - '.github/workflows/strict-wdl-denormal-mode-oracle.yml'
      - 'tests/no_global_fast_math.rs'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: strict-wdl-denormal-mode-oracle
  cancel-in-progress: false

jobs:
  denormal-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening-reapeaks-cache-ffmpeg
          submodules: recursive
          fetch-depth: 0

      - name: Download fixed known-failing exact oracle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/strict-wdl-denormal
          mkdir -p "$root/input" "$root/results" "$root/preload"
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33395560284/artifacts" --jq '.artifacts[] | select(.expired == false) | .id' | head -1)"
          test -n "$artifact_id"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$root/artifact.zip"
          unzip -q "$root/artifact.zip" -d "$root/input"

      - name: Build process-start floating-point environment probes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/strict-wdl-denormal/preload/fpenv.c <<'C'
          #include <fenv.h>
          #include <stdint.h>
          #if defined(__x86_64__) || defined(__i386__)
          #include <xmmintrin.h>
          #endif
          #ifndef FP_MODE
          #define FP_MODE 0
          #endif
          #ifndef ROUND_MODE
          #define ROUND_MODE FE_TONEAREST
          #endif
          __attribute__((constructor)) static void configure_reaper_probe_environment(void) {
          #if defined(__x86_64__) || defined(__i386__)
            unsigned csr = _mm_getcsr();
            csr &= ~((1u << 15) | (1u << 6));
            #if FP_MODE == 1
              csr |= (1u << 15);
            #elif FP_MODE == 2
              csr |= (1u << 6);
            #elif FP_MODE == 3
              csr |= (1u << 15) | (1u << 6);
            #endif
            _mm_setcsr(csr);
          #endif
            fesetround(ROUND_MODE);
          }
          C
          build() {
            local name="$1" mode="$2" rounding="$3"
            cc -shared -fPIC -O2 -DFP_MODE="$mode" -DROUND_MODE="$rounding" \
              /tmp/strict-wdl-denormal/preload/fpenv.c -lm \
              -o "/tmp/strict-wdl-denormal/preload/${name}.so"
          }
          build clear 0 FE_TONEAREST
          build ftz 1 FE_TONEAREST
          build daz 2 FE_TONEAREST
          build ftz-daz 3 FE_TONEAREST
          build ftz-daz-down 3 FE_DOWNWARD
          build ftz-daz-up 3 FE_UPWARD
          build ftz-daz-zero 3 FE_TOWARDZERO

      - name: Run exact comparison under every MXCSR/rounding mode
        id: process
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import re
          import shutil
          import subprocess
          import time

          root=Path('/tmp/strict-wdl-denormal');inputs=root/'input';results=root/'results';preload=root/'preload'
          source=Path('tests/reaper_ffmpeg_byte_identical.rs').read_text(encoding='utf-8')
          names=sorted(set(re.findall(r'(?:std::)?env::var(?:_os)?\(\s*"([A-Z0-9_]+)"',source)))
          dirs=[p for p in inputs.rglob('*') if p.is_dir()]
          peak=max(dirs or [inputs],key=lambda p:sum(1 for q in p.rglob('*.reapeaks')))
          pcm=max(dirs or [inputs],key=lambda p:sum(1 for q in p.rglob('*') if q.suffix.lower() in {'.s16le','.pcm','.raw','.wav','.m4a'}))
          variants=['baseline','clear','ftz','daz','ftz-daz','ftz-daz-down','ftz-daz-up','ftz-daz-zero']
          rows=[]
          for index,name in enumerate(variants):
              output=root/'outputs'/name;shutil.rmtree(output,ignore_errors=True);output.mkdir(parents=True)
              env=os.environ.copy()
              for variable in names:
                  if any(t in variable for t in ('OUT','RESULT','CANDIDATE','GENERATED')):value=output
                  elif any(t in variable for t in ('PCM','DECODE','AUDIO','MEDIA','SOURCE')):value=pcm
                  else:value=peak
                  env[variable]=str(value)
              if name!='baseline':env['LD_PRELOAD']=str(preload/f'{name}.so')
              start=time.monotonic();completed=subprocess.run(['cargo','test','--all-features','--test','reaper_ffmpeg_byte_identical','--','--nocapture'],env=env,text=True,capture_output=True,timeout=1200)
              text=(completed.stdout or '')+'\n'+(completed.stderr or '');(results/f'{index:02d}-{name}.log').write_text(text)
              numbers=[int(x) for x in re.findall(r'(?i)(?:diff(?:ering)?[_ ]bytes|mismatch(?:es)?)[^0-9]{0,20}(\d+)',text)]
              rows.append({'name':name,'returncode':completed.returncode,'exact_pass':completed.returncode==0 and '0 tests' not in text.lower(),'reported_distance':min(numbers) if numbers else None,'elapsed_seconds':time.monotonic()-start,'tail':text[-6000:]})
          report={'schema':1,'rows':rows,'exact_modes':[r['name'] for r in rows if r['exact_pass']]}
          (results/'process-environment-report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('exact_modes='+json.dumps(report['exact_modes'],separators=(',',':'))+'\n')
          PY

      - name: Construct scoped FTZ/DAZ candidates when process mode changes the result
        id: scoped
        shell: bash
        env:
          EXACT_MODES: ${{ steps.process.outputs.exact_modes }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import re
          import shutil
          import subprocess
          import time

          modes=json.loads(os.environ.get('EXACT_MODES','[]'))
          # Even if no mode completely passes, test scoped FTZ/DAZ when it reduced the mismatch.
          process_report=json.loads(Path('/tmp/strict-wdl-denormal/results/process-environment-report.json').read_text())
          ranked=sorted([r for r in process_report['rows'] if r['name'] not in ('baseline','clear') and r['reported_distance'] is not None],key=lambda r:r['reported_distance'])
          candidate_modes=[]
          for name in modes+[r['name'] for r in ranked[:3]]:
              base=name.split('-down')[0].split('-up')[0].split('-zero')[0]
              if base in ('ftz','daz','ftz-daz') and base not in candidate_modes:candidate_modes.append(base)
          if not candidate_modes:
              candidate_modes=['ftz','daz','ftz-daz']

          cpp_files=[]
          for root in (Path('native'),Path('src')):
              if root.exists():cpp_files.extend(p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.cc','.cpp','.cxx'})
          wrappers=[p for p in cpp_files if 'extern "C"' in p.read_text(encoding='utf-8',errors='replace')]
          if not wrappers:raise SystemExit('no compiled C++ extern-C wrapper source found')
          originals={p:p.read_text(encoding='utf-8',errors='replace') for p in wrappers}
          build_original=Path('build.rs').read_text(encoding='utf-8') if Path('build.rs').exists() else ''

          root=Path('/tmp/strict-wdl-denormal');inputs=root/'input';results=root/'results'
          test_source=Path('tests/reaper_ffmpeg_byte_identical.rs').read_text(encoding='utf-8')
          env_names=sorted(set(re.findall(r'(?:std::)?env::var(?:_os)?\(\s*"([A-Z0-9_]+)"',test_source)))
          dirs=[p for p in inputs.rglob('*') if p.is_dir()]
          peak=max(dirs or [inputs],key=lambda p:sum(1 for q in p.rglob('*.reapeaks')))
          pcm=max(dirs or [inputs],key=lambda p:sum(1 for q in p.rglob('*') if q.suffix.lower() in {'.s16le','.pcm','.raw','.wav','.m4a'}))

          def restore():
              for path,text in originals.items():path.write_text(text,encoding='utf-8')
              if build_original:Path('build.rs').write_text(build_original,encoding='utf-8')
              Path('native/reaper_fp_environment_guard.h').unlink(missing_ok=True)

          def run(label):
              output=root/'scoped-output'/label;shutil.rmtree(output,ignore_errors=True);output.mkdir(parents=True)
              env=os.environ.copy()
              for variable in env_names:
                  if any(t in variable for t in ('OUT','RESULT','CANDIDATE','GENERATED')):value=output
                  elif any(t in variable for t in ('PCM','DECODE','AUDIO','MEDIA','SOURCE')):value=pcm
                  else:value=peak
                  env[variable]=str(value)
              completed=subprocess.run(['cargo','test','--all-features','--test','reaper_ffmpeg_byte_identical','--','--nocapture'],env=env,text=True,capture_output=True,timeout=1200)
              text=(completed.stdout or '')+'\n'+(completed.stderr or '');(results/f'scoped-{label}.log').write_text(text)
              return {'label':label,'returncode':completed.returncode,'exact_pass':completed.returncode==0 and '0 tests' not in text.lower(),'tail':text[-6000:]}

          rows=[];winner=None
          for mode in candidate_modes:
              for scope in ('all-extern-c','loudness-extern-c'):
                  restore()
                  bits={'ftz':1<<15,'daz':1<<6,'ftz-daz':(1<<15)|(1<<6)}[mode]
                  header=Path('native/reaper_fp_environment_guard.h');header.parent.mkdir(parents=True,exist_ok=True)
                  header.write_text(f'''#pragma once\n#if defined(__x86_64__) || defined(__i386__) || defined(_M_X64) || defined(_M_IX86)\n#include <xmmintrin.h>\nclass ReaperFpEnvironmentGuard final {{\n public:\n  ReaperFpEnvironmentGuard() noexcept : previous_(_mm_getcsr()) {{ _mm_setcsr(previous_ | {bits}u); }}\n  ~ReaperFpEnvironmentGuard() noexcept {{ _mm_setcsr(previous_); }}\n  ReaperFpEnvironmentGuard(const ReaperFpEnvironmentGuard&) = delete;\n  ReaperFpEnvironmentGuard& operator=(const ReaperFpEnvironmentGuard&) = delete;\n private:\n  unsigned previous_;\n}};\n#else\nclass ReaperFpEnvironmentGuard final {{ public: ReaperFpEnvironmentGuard() noexcept = default; }};\n#endif\n''',encoding='utf-8')
                  inserted=0
                  for path,text in originals.items():
                      include='#include "reaper_fp_environment_guard.h"\n'
                      if include not in text:
                          first_include=text.find('#include')
                          if first_include>=0:text=text[:first_include]+include+text[first_include:]
                          else:text=include+text
                      pattern=re.compile(r'(?m)(extern\s+"C"[^;\n]*?\([^;]*?\)\s*(?:noexcept\s*)?\{)')
                      def repl(match):
                          nonlocal inserted
                          signature=match.group(1)
                          if scope=='loudness-extern-c' and not re.search(r'loud|wdl|r128|ebu|peak',signature,re.I):return signature
                          inserted+=1
                          return signature+'\n  ReaperFpEnvironmentGuard reaper_fp_environment_guard;'
                      text=pattern.sub(repl,text)
                      path.write_text(text,encoding='utf-8')
                  if inserted==0:
                      rows.append({'label':f'{mode}-{scope}','exact_pass':False,'reason':'no functions instrumented'});continue
                  subprocess.run(['cargo','clean'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,check=False)
                  row=run(f'{mode}-{scope}');row['instrumented_functions']=inserted;rows.append(row)
                  if row['exact_pass']:
                      patch=subprocess.run(['git','diff','--','native','src','build.rs'],text=True,capture_output=True,check=True).stdout
                      (results/'scoped-winner.patch').write_text(patch)
                      winner=row['label'];break
              if winner:break
          report={'schema':1,'candidate_modes':candidate_modes,'rows':rows,'winner':winner}
          (results/'scoped-report.json').write_text(json.dumps(report,indent=2)+'\n');print(json.dumps(report,indent=2))
          restore()
          if winner:
              subprocess.run(['git','apply',str(results/'scoped-winner.patch')],check=True)
              verify=run('winner-reapplied')
              if not verify['exact_pass']:raise SystemExit('scoped winner did not reproduce after clean reapply')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:output.write(f'winner={winner or ""}\n')
          PY

      - name: Add restoration and concurrency regression tests for a scoped winner
        if: steps.scoped.outputs.winner != ''
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/strict_wdl_fp_environment.rs <<'RS'
          #[cfg(all(feature = "strict-wdl", any(target_arch = "x86", target_arch = "x86_64")))]
          #[test]
          fn strict_wdl_calls_restore_the_callers_mxcsr() {
              // The exact-oracle test verifies the active processing semantics.  This
              // regression test prevents the scoped guard from leaking FTZ/DAZ or a
              // rounding-mode change into unrelated caller code.  The concrete FFI
              // entry points are exercised by the existing strict-WDL boundary suite;
              // compare MXCSR around that suite at process level as well.
              #[cfg(target_arch = "x86")]
              use std::arch::x86::{_mm_getcsr, _mm_setcsr};
              #[cfg(target_arch = "x86_64")]
              use std::arch::x86_64::{_mm_getcsr, _mm_setcsr};
              unsafe {
                  let original = _mm_getcsr();
                  let sentinel = original ^ ((1 << 15) | (1 << 6));
                  _mm_setcsr(sentinel);
                  // A zero-work exact public operation must still traverse the same
                  // strict-WDL FFI wrapper without retaining its temporary mode.
                  let _ = libreapeaks::default_divisions(48_000, 300);
                  assert_eq!(_mm_getcsr(), sentinel);
                  _mm_setcsr(original);
              }
          }
          RS

      - name: Full validation and commit only a scoped exact winner
        if: steps.scoped.outputs.winner != ''
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --all-features
          cargo clippy --all-targets --all-features -- -D warnings
          destination=oracle-reports/strict-wdl-denormal-mode
          rm -rf "$destination";mkdir -p "$destination"
          cp /tmp/strict-wdl-denormal/results/process-environment-report.json "$destination/process-report.json"
          cp /tmp/strict-wdl-denormal/results/scoped-report.json "$destination/scoped-report.json"
          cp /tmp/strict-wdl-denormal/results/scoped-winner.patch "$destination/scoped-winner.patch"
          git add native src tests/strict_wdl_fp_environment.rs "$destination"
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'match REAPER scoped FTZ/DAZ semantics'
          git push origin HEAD:hardening-reapeaks-cache-ffmpeg

      - name: Publish negative result without changing implementation
        if: steps.scoped.outputs.winner == ''
        shell: bash
        run: |
          set -euo pipefail
          destination=oracle-reports/strict-wdl-denormal-mode
          rm -rf "$destination";mkdir -p "$destination"
          cp /tmp/strict-wdl-denormal/results/process-environment-report.json "$destination/process-report.json"
          cp /tmp/strict-wdl-denormal/results/scoped-report.json "$destination/scoped-report.json"
          git add "$destination"
          if git diff --cached --quiet;then exit 0;fi
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'record REAPER FTZ/DAZ hypothesis result'
          git push origin HEAD:hardening-reapeaks-cache-ffmpeg

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strict-wdl-denormal-mode-${{ github.sha }}
          path: /tmp/strict-wdl-denormal/results
          retention-days: 30
