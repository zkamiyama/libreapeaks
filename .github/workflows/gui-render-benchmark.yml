name: gui-render-benchmark

on:
  push:
    branches: [demo-player-native-modes]
    paths:
      - 'src/gpu_cache.rs'
      - 'src/python_gpu_cache.rs'
      - 'src/python.rs'
      - 'examples/benchmark_gui_paths.py'
      - 'examples/benchmark_gl_renderer.py'
      - 'examples/pyside6_gl_view.py'
      - 'examples/pyside6_reaper_gl_view.py'
      - 'examples/pyside6_player.py'
      - '.github/workflows/gui-render-benchmark.yml'
  pull_request:
    paths:
      - 'src/gpu_cache.rs'
      - 'src/python_gpu_cache.rs'
      - 'src/python.rs'
      - 'examples/benchmark_gui_paths.py'
      - 'examples/benchmark_gl_renderer.py'
      - 'examples/pyside6_gl_view.py'
      - 'examples/pyside6_reaper_gl_view.py'
      - 'examples/pyside6_player.py'
      - '.github/workflows/gui-render-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Mesa/Xvfb and complete Qt XCB runtime
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb libgl1-mesa-dri libegl1 mesa-utils \
            libdbus-1-3 libfontconfig1 libfreetype6 libglib2.0-0 libx11-6 libx11-xcb1 \
            libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render0 libxcb-render-util0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libxext6 libxkbcommon0 libxkbcommon-x11-0 libxrender1
          python -m pip install --upgrade pip maturin PySide6
      - name: Diagnose Qt XCB linkage
        shell: bash
        run: |
          set -euo pipefail
          plugin="$(python - <<'PY'
          from pathlib import Path
          import PySide6
          root = Path(PySide6.__file__).resolve().parent
          matches = list(root.rglob('libqxcb.so'))
          if not matches:
              raise SystemExit('libqxcb.so not found')
          print(matches[0])
          PY
          )"
          echo "Qt XCB plugin: $plugin"
          ldd "$plugin" | tee /tmp/qxcb-ldd.txt
          if grep -Fq 'not found' /tmp/qxcb-ldd.txt; then
            echo 'Qt XCB runtime still has missing shared libraries' >&2
            exit 1
          fi
      - name: Build and install libreapeaks Python wheel
        shell: bash
        run: |
          maturin build --release --out dist
          python -m pip install dist/*.whl
      - name: Benchmark CPU-side GUI preparation paths
        shell: bash
        run: |
          set -euo pipefail
          python examples/benchmark_gui_paths.py \
            --seconds 30 \
            --open-iterations 20 \
            --tile-iterations 300 | tee /tmp/gui-path-bench.txt
          grep -Fq 'GUI_PATH_BENCH ' /tmp/gui-path-bench.txt
      - name: Smoke and benchmark packed GLSL renderer with Mesa llvmpipe
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          QT_OPENGL: desktop
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1600x900x24' \
            python examples/benchmark_gl_renderer.py | tee /tmp/glsl-render-bench.txt
          grep -Fq 'GLSL_RENDER_BENCH ' /tmp/glsl-render-bench.txt
      - name: Upload benchmark telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-render-benchmark-${{ github.sha }}
          path: |
            /tmp/gui-path-bench.txt
            /tmp/glsl-render-bench.txt
            /tmp/qxcb-ldd.txt
          if-no-files-found: warn
          retention-days: 14
