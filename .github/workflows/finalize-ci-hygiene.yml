name: finalize-ci-hygiene

on:
  push:
    branches:
      - hardening-reapeaks-cache-ffmpeg

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make formatting verification read-only
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          updated, count = re.subn(
              r'(?m)^(\s*run:\s*)cargo fmt --all\s*$',
              r'\1cargo fmt --all -- --check',
              text,
          )
          if count == 0 and 'cargo fmt --all -- --check' not in text:
              raise SystemExit('could not locate the CI formatting command')
          path.write_text(updated, encoding='utf-8')

      - name: Remove temporary diagnostic workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/dev-snapshot.yml
          rm -f .github/workflows/finalize-ci-hygiene.yml

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .github/workflows
          git commit -m "Make CI formatting checks non-mutating"
          git push origin "HEAD:${GITHUB_REF_NAME}"
