          fn bare_header(channels: u8, mipmaps: u8, sample_rate: u32) -> Vec<u8> {
              let mut raw = Vec::new();
              raw.extend_from_slice(b"RPKN");
              raw.push(channels);
              raw.push(mipmaps);
              raw.extend_from_slice(&sample_rate.to_le_bytes());
