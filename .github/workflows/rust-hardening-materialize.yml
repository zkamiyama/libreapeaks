                  .first_peak
                  .saturating_add(plan.peak_count.saturating_sub(1));
              let b = last / tile;
              (a..=b)
                  .map(|t| WaveTileKey {
                      level_index,
                      tile_index: t as u64,
                  })
                  .collect()
          }

          '''
          )
          replace_once(
              'src/pyramid.rs',
              '''        let meta = *self.levels.get(key.level_index as usize)?;
              let first = (key.tile_index as usize).saturating_mul(self.tile_peaks);
              if first >= meta.peak_count {
          ''',
              '''        let meta = *self.levels.get(key.level_index as usize)?;
              let tile_index = usize::try_from(key.tile_index).ok()?;
              let first = tile_index.checked_mul(self.tile_peaks)?;
              if first >= meta.peak_count {
          '''
          )
          replace_once(
              'src/pyramid.rs',
              '        Some((meta.peak_count + t - 1) / t)\n',
              '        Some(meta.peak_count.div_ceil(t))\n'
          )

          # ffi.rs: reject integer truncation and raw-slice length overflow before unsafe slice creation.
          replace_section(
              'src/ffi.rs',
              '#[no_mangle]\npub unsafe extern "C" fn rpk_open(',
              '#[no_mangle]\npub unsafe extern "C" fn rpk_close',
              '''#[no_mangle]
          pub unsafe extern "C" fn rpk_open(path: *const c_char, out: *mut *mut RpkHandle) -> i32 {
              if out.is_null() {
                  return -1;
              }
              *out = ptr::null_mut();
