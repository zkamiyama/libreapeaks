name: rust-hardening-materialize

on:
  push:
    branches: [hardening-reapeaks-cache-ffmpeg]
    paths:
      - '.github/workflows/rust-hardening-materialize.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply defensive Rust hardening and adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          def replace_section(path, start, end, new):
              p = Path(path)
              text = p.read_text()
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f'start marker not found in {path}: {start!r}')
              b = text.find(end, a)
              if b < 0:
                  raise SystemExit(f'end marker not found in {path}: {end!r}')
              p.write_text(text[:a] + new + text[b:])

          # generate.rs: reject header truncation, invalid divisions, and layer-count overflow up front.
          replace_section(
              'src/generate.rs',
              'fn validate(options: &GenerateOptions, sample_len: usize) -> Result<usize> {',
              '\n}\n\n/// Generate RPKN',
              '''fn validate(options: &GenerateOptions, sample_len: usize) -> Result<usize> {
              if options.channels == 0 {
                  return Err(ReaPeaksError::InvalidArgument("channels=0"));
              }
              if options.channels > u8::MAX as usize {
                  return Err(ReaPeaksError::InvalidArgument(
                      "channels exceed .ReaPeaks header capacity",
                  ));
              }
              if options.sample_rate == 0 {
                  return Err(ReaPeaksError::InvalidArgument("sample_rate=0"));
              }
              if options.divisions.is_empty() {
                  return Err(ReaPeaksError::InvalidArgument("no waveform divisions"));
              }
              if options.divisions.iter().any(|&x| x == 0) {
                  return Err(ReaPeaksError::InvalidArgument("division=0"));
              }
              if options.divisions.iter().any(|&x| x > i32::MAX as u32) {
                  return Err(ReaPeaksError::InvalidArgument(
                      "division exceeds signed .ReaPeaks range",
                  ));
              }
              let layer_count = if options.spectral {
                  options
                      .divisions
                      .len()
                      .checked_mul(2)
                      .ok_or(ReaPeaksError::InvalidArgument("too many layers"))?
              } else {
                  options.divisions.len()
              };
              if layer_count > u8::MAX as usize {
                  return Err(ReaPeaksError::InvalidArgument("too many layers"));
              }
              if sample_len % options.channels != 0 {
                  return Err(ReaPeaksError::InvalidArgument(
                      "PCM is not whole interleaved frames",
                  ));
              }
              Ok(sample_len / options.channels)
          }'''
          )

          # wave.rs: checked geometry, count/header bounds, and arithmetic-safe bucketing.
          replace_section(
              'src/wave.rs',
              'pub fn build_wave_layers(\n',
              '/// Build RPKN or RPKL waveform layers from decoded float32 audio.',
              '''pub fn build_wave_layers(
              pcm: &[i16],
              frames: usize,
              channels: usize,
              divisions: &[u32],
          ) -> Result<Vec<GeneratedLayer>> {
              if channels == 0 {
                  return Err(ReaPeaksError::InvalidArgument("channels=0"));
              }
              let required = frames
                  .checked_mul(channels)
                  .ok_or(ReaPeaksError::InvalidArgument("frames*channels overflow"))?;
              if pcm.len() < required {
                  return Err(ReaPeaksError::InvalidArgument("PCM buffer shorter than frames*channels"));
              }
              let mut layers = Vec::with_capacity(divisions.len());
              for &div in divisions {
                  if div == 0 {
                      return Err(ReaPeaksError::InvalidArgument("division=0"));
                  }
                  if div > i32::MAX as u32 {
                      return Err(ReaPeaksError::InvalidArgument(
                          "division exceeds signed .ReaPeaks range",
                      ));
                  }
                  let d = div as usize;
                  let count = frames.div_ceil(d);
                  let peak_count = u32::try_from(count)
                      .map_err(|_| ReaPeaksError::InvalidArgument("wave peak count exceeds u32"))?;
                  let capacity = count
                      .checked_mul(channels)
                      .and_then(|x| x.checked_mul(4))
                      .filter(|&x| x <= isize::MAX as usize)
                      .ok_or(ReaPeaksError::InvalidArgument("wave payload too large"))?;
                  let mut bytes = Vec::with_capacity(capacity);
                  for peak in 0..count {
                      let s0 = peak * d;
                      let s1 = s0.saturating_add(d).min(frames);
                      for c in 0..channels {
                          let mut mx = i16::MIN;
                          let mut mn = i16::MAX;
                          for f in s0..s1 {
                              let v = quantize_pcm16_peak(pcm[f * channels + c]);
                              mx = mx.max(v);
                              mn = mn.min(v);
                          }
                          if s0 == s1 {
                              mx = 0;
                              mn = 0;
                          }
                          bytes.extend_from_slice(&mx.to_le_bytes());
                          bytes.extend_from_slice(&mn.to_le_bytes());
                      }
                  }
                  layers.push(GeneratedLayer {
                      header: LayerHeader {
                          division: div as i32,
                          peak_count,
                      },
                      bytes,
                  });
              }
              Ok(layers)
          }

          '''
          )
          replace_section(
              'src/wave.rs',
              'pub fn build_wave_layers_f32(\n',
              'pub fn aggregate_peaks(',
              '''pub fn build_wave_layers_f32(
              pcm: &[f32],
              frames: usize,
              channels: usize,
              divisions: &[u32],
              encoding: WaveEncoding,
          ) -> Result<Vec<GeneratedLayer>> {
              if channels == 0 {
                  return Err(ReaPeaksError::InvalidArgument("channels=0"));
              }
              let required = frames
                  .checked_mul(channels)
                  .ok_or(ReaPeaksError::InvalidArgument("frames*channels overflow"))?;
              if pcm.len() < required {
                  return Err(ReaPeaksError::InvalidArgument("PCM buffer shorter than frames*channels"));
              }
              let mut layers = Vec::with_capacity(divisions.len());
              for &div in divisions {
                  if div == 0 {
                      return Err(ReaPeaksError::InvalidArgument("division=0"));
                  }
                  if div > i32::MAX as u32 {
                      return Err(ReaPeaksError::InvalidArgument(
                          "division exceeds signed .ReaPeaks range",
                      ));
                  }
                  let d = div as usize;
                  let count = frames.div_ceil(d);
                  let peak_count = u32::try_from(count)
                      .map_err(|_| ReaPeaksError::InvalidArgument("wave peak count exceeds u32"))?;
                  let capacity = count
                      .checked_mul(channels)
                      .and_then(|x| x.checked_mul(4))
                      .filter(|&x| x <= isize::MAX as usize)
                      .ok_or(ReaPeaksError::InvalidArgument("wave payload too large"))?;
                  let mut bytes = Vec::with_capacity(capacity);
                  for peak in 0..count {
                      let s0 = peak * d;
                      let s1 = s0.saturating_add(d).min(frames);
                      for c in 0..channels {
                          let (mut mx, mut mn) = match encoding {
                              WaveEncoding::Rpkn | WaveEncoding::Rpkl => (-1.0f32, 1.0f32),
                          };
                          for f in s0..s1 {
                              let v = pcm[f * channels + c];
                              if v.is_nan() {
                                  continue;
                              }
                              if v > mx {
                                  mx = v;
                              }
                              if v < mn {
                                  mn = v;
                              }
                          }
                          if s0 == s1 {
                              mx = 0.0;
                              mn = 0.0;
                          }
                          let enc = |v: f32| match encoding {
                              WaveEncoding::Rpkn => quantize_rpkn_f32(v),
                              WaveEncoding::Rpkl => quantize_rpkl_f32(v),
                          };
                          bytes.extend_from_slice(&enc(mx).to_le_bytes());
                          bytes.extend_from_slice(&enc(mn).to_le_bytes());
                      }
                  }
                  layers.push(GeneratedLayer {
                      header: LayerHeader {
                          division: div as i32,
                          peak_count,
                      },
                      bytes,
                  });
              }
              Ok(layers)
          }

          '''
          )
          replace_once(
              'src/wave.rs',
              '''    let n = input.len() / channels;
              let out_n = (n + factor - 1) / factor;
              let mut out = Vec::with_capacity(out_n * channels);
              for p in 0..out_n {
                  let a = p * factor;
                  let b = (a + factor).min(n);
          ''',
              '''    let n = input.len() / channels;
              let out_n = n.div_ceil(factor);
              let mut out = Vec::with_capacity(out_n * channels);
              for p in 0..out_n {
                  let a = p * factor;
                  let b = a.saturating_add(factor).min(n);
          '''
          )

          # format.rs: parser must reject malformed headers/tokens/trailing data and never overflow offsets.
          replace_once(
              'src/format.rs',
              '''fn get<const N: usize>(b: &[u8], o: usize) -> Result<[u8; N]> {
              b.get(o..o + N)
                  .ok_or(ReaPeaksError::Truncated)?
                  .try_into()
                  .map_err(|_| ReaPeaksError::Truncated)
          }
          ''',
              '''fn get<const N: usize>(b: &[u8], o: usize) -> Result<[u8; N]> {
              let end = o.checked_add(N).ok_or(ReaPeaksError::Truncated)?;
              b.get(o..end)
                  .ok_or(ReaPeaksError::Truncated)?
                  .try_into()
                  .map_err(|_| ReaPeaksError::Truncated)
          }

          fn is_known_layer_division(division: i32) -> bool {
              division > 0
                  || matches!(
                      division,
                      TOKEN_SPECTRAL | TOKEN_SPECTROGRAM | TOKEN_LOUDNESS | TOKEN_LOUDNESS_OLD
                  )
          }

          fn checked_end(off: usize, size: usize) -> Result<usize> {
              off.checked_add(size)
                  .ok_or(ReaPeaksError::InvalidHeader("layer offset overflow"))
          }
          '''
          )
          replace_section(
              'src/format.rs',
              'impl ReaPeaks {\n',
              '#[derive(Debug, Clone)]\npub struct GeneratedLayer',
              '''impl ReaPeaks {
              pub fn open(path: impl AsRef<Path>) -> Result<Self> {
                  Self::parse(fs::read(path)?)
              }

              pub fn parse(raw: Vec<u8>) -> Result<Self> {
                  if raw.len() < 18 {
                      return Err(ReaPeaksError::Truncated);
                  }
                  let magic = get::<4>(&raw, 0)?;
                  let version = match &magic {
                      b"RPKM" => Version::Rpkm,
                      b"RPKN" => Version::Rpkn,
                      b"RPKL" => Version::Rpkl,
                      _ => return Err(ReaPeaksError::InvalidMagic(magic)),
                  };
                  let channels = raw[4];
                  let mipmap_count = raw[5];
                  if channels == 0 {
                      return Err(ReaPeaksError::InvalidHeader("channels=0"));
                  }
                  let sample_rate = u32::from_le_bytes(get::<4>(&raw, 6)?);
                  if sample_rate == 0 {
                      return Err(ReaPeaksError::InvalidHeader("sample_rate=0"));
                  }
                  let header = Header {
                      version,
                      channels,
                      mipmap_count,
                      sample_rate,
                      source_mtime_low32: u32::from_le_bytes(get::<4>(&raw, 10)?),
                      source_size_low32: u32::from_le_bytes(get::<4>(&raw, 14)?),
                  };
                  let mut off = 18usize;
                  let mut hs = Vec::with_capacity(mipmap_count as usize);
                  for _ in 0..mipmap_count {
                      let division = i32::from_le_bytes(get::<4>(&raw, off)?);
                      let peak_count = u32::from_le_bytes(get::<4>(&raw, checked_end(off, 4)?)?);
                      off = checked_end(off, 8)?;
                      hs.push(LayerHeader {
                          division,
                          peak_count,
                      });
                  }

                  let channels_usize = channels as usize;
                  let positive_divs: Vec<u32> = hs
                      .iter()
                      .filter_map(|h| (h.division > 0).then_some(h.division as u32))
                      .collect();
                  let mut spectral_index = 0usize;
                  let mut wave_layers = Vec::new();
                  let mut spectral_layers = Vec::new();

                  for (idx, h) in hs.iter().copied().enumerate() {
                      if !is_known_layer_division(h.division) {
                          return Err(ReaPeaksError::Unsupported("unknown layer token"));
                      }
                      match h.kind() {
                          LayerKind::Wave => {
                              let n = h.peak_count as usize;
                              let sample_count = n
                                  .checked_mul(channels_usize)
                                  .ok_or(ReaPeaksError::InvalidHeader("layer size overflow"))?;
                              match version {
                                  Version::Rpkm => {
                                      let size = sample_count
                                          .checked_mul(2)
                                          .ok_or(ReaPeaksError::InvalidHeader("layer size overflow"))?;
                                      let end = checked_end(off, size)?;
                                      if end > raw.len() {
                                          return Err(ReaPeaksError::Truncated);
                                      }
                                      off = end;
                                  }
                                  Version::Rpkn | Version::Rpkl => {
                                      let size = sample_count
                                          .checked_mul(4)
                                          .ok_or(ReaPeaksError::InvalidHeader("layer size overflow"))?;
                                      let end = checked_end(off, size)?;
                                      if end > raw.len() {
                                          return Err(ReaPeaksError::Truncated);
                                      }
                                      let mut peaks = Vec::with_capacity(sample_count);
                                      for i in 0..sample_count {
                                          let p = off + i * 4;
                                          peaks.push(PeakPair {
                                              max: i16::from_le_bytes(get::<2>(&raw, p)?),
                                              min: i16::from_le_bytes(get::<2>(&raw, p + 2)?),
                                          });
                                      }
                                      off = end;
                                      wave_layers.push(WaveLayer {
                                          division: h.division as u32,
                                          peaks,
                                      });
                                  }
                              }
                          }
                          LayerKind::Spectral => {
                              let n = h.peak_count as usize;
                              let sample_count = n
                                  .checked_mul(channels_usize)
                                  .ok_or(ReaPeaksError::InvalidHeader("spectral size overflow"))?;
                              let size = sample_count
                                  .checked_mul(4)
                                  .ok_or(ReaPeaksError::InvalidHeader("spectral size overflow"))?;
                              let end = checked_end(off, size)?;
                              if end > raw.len() {
                                  return Err(ReaPeaksError::Truncated);
                              }
                              let mirrored_division = positive_divs
                                  .get(spectral_index)
                                  .copied()
                                  .ok_or(ReaPeaksError::InvalidHeader(
                                      "spectral layer without matching waveform layer",
                                  ))?;
                              let mut peaks = Vec::with_capacity(sample_count);
                              for i in 0..sample_count {
                                  let code = u32::from_le_bytes(get::<4>(&raw, off + i * 4)?);
                                  peaks.push(SpectralPeak::from_code(code));
                              }
                              off = end;
                              spectral_layers.push(SpectralLayer {
                                  mirrored_division,
                                  peaks,
                              });
                              spectral_index += 1;
                          }
                          LayerKind::Spectrogram => {
                              let size = layer_payload_size(version, h, channels_usize)
                                  .ok_or(ReaPeaksError::Unsupported("spectrogram layout"))?;
                              let end = checked_end(off, size)?;
                              if end > raw.len() {
                                  return Err(ReaPeaksError::Truncated);
                              }
                              off = end;
                          }
                          LayerKind::Loudness | LayerKind::LoudnessOld => {
                              // REAPER 7.79 fixtures use at least 4 bytes/channel/sample.
                              // A final loudness layer may contain a larger opaque payload,
                              // but it may not be shorter than the observed minimum.
                              let size = (h.peak_count as usize)
                                  .checked_mul(channels_usize)
                                  .and_then(|x| x.checked_mul(4))
                                  .ok_or(ReaPeaksError::InvalidHeader("loudness size overflow"))?;
                              let end = checked_end(off, size)?;
                              if end > raw.len() {
                                  return Err(ReaPeaksError::Truncated);
                              }
                              off = if idx + 1 == hs.len() { raw.len() } else { end };
                          }
                      }
                  }

                  if off != raw.len() {
                      return Err(ReaPeaksError::InvalidHeader("trailing bytes after layers"));
                  }

                  Ok(Self {
                      header,
                      layer_headers: hs,
                      wave_layers,
                      spectral_layers,
                      raw,
                  })
              }
          }

          '''
          )
          replace_section(
              'src/format.rs',
              'pub fn encode(\n',
              'pub fn encode_rpkn(',
              '''pub fn encode(
              version: Version,
              channels: u8,
              sample_rate: u32,
              source_mtime_low32: u32,
              source_size_low32: u32,
              layers: &[GeneratedLayer],
          ) -> Result<Vec<u8>> {
              if channels == 0 {
                  return Err(ReaPeaksError::InvalidArgument("channels=0"));
              }
              if sample_rate == 0 {
                  return Err(ReaPeaksError::InvalidArgument("sample_rate=0"));
              }
              if version == Version::Rpkm {
                  return Err(ReaPeaksError::Unsupported("RPKM writer"));
              }
              if layers.len() > u8::MAX as usize {
                  return Err(ReaPeaksError::InvalidArgument("too many layers"));
              }
              for layer in layers {
                  if !is_known_layer_division(layer.header.division) {
                      return Err(ReaPeaksError::InvalidArgument("unknown layer token"));
                  }
                  if let Some(expected) = layer_payload_size(version, layer.header, channels as usize) {
                      if expected != layer.bytes.len() {
                          return Err(ReaPeaksError::InvalidArgument("layer payload length mismatch"));
                      }
                  }
              }
              let total_payload = layers.iter().try_fold(0usize, |total, layer| {
                  total.checked_add(layer.bytes.len())
              }).ok_or(ReaPeaksError::InvalidArgument("encoded size overflow"))?;
              let capacity = layers
                  .len()
                  .checked_mul(8)
                  .and_then(|x| x.checked_add(18))
                  .and_then(|x| x.checked_add(total_payload))
                  .filter(|&x| x <= isize::MAX as usize)
                  .ok_or(ReaPeaksError::InvalidArgument("encoded file too large"))?;
              let mut out = Vec::with_capacity(capacity);
              out.extend_from_slice(&version.magic());
              out.push(channels);
              out.push(layers.len() as u8);
              out.extend_from_slice(&sample_rate.to_le_bytes());
              out.extend_from_slice(&source_mtime_low32.to_le_bytes());
              out.extend_from_slice(&source_size_low32.to_le_bytes());
              for layer in layers {
                  out.extend_from_slice(&layer.header.division.to_le_bytes());
                  out.extend_from_slice(&layer.header.peak_count.to_le_bytes());
              }
              for layer in layers {
                  out.extend_from_slice(&layer.bytes);
              }
              Ok(out)
          }

          '''
          )

          # pyramid.rs: avoid division/index truncation and u64/usize wraparound.
          replace_once(
              'src/pyramid.rs',
              '.map(|l| l.peak_count(channels) as u64 * l.division as u64)',
              '.map(|l| (l.peak_count(channels) as u64).saturating_mul(l.division as u64))'
          )
          replace_once(
              'src/pyramid.rs',
              '''        let mut native_levels: Vec<NativeWaveLevel> = native
              .iter()
              .map(|x| NativeWaveLevel {
          ''',
              '''        let mut native_levels: Vec<NativeWaveLevel> = native
              .iter()
              .filter(|x| x.division != 0)
              .map(|x| NativeWaveLevel {
          '''
          )
          replace_once(
              'src/pyramid.rs',
              '''                let count = if fine_count == 0 {
                  0
              } else {
                  (fine_count + factor - 1) / factor
              };
          ''',
              '''                let count = if fine_count == 0 {
                  0
              } else {
                  fine_count.div_ceil(factor)
              };
          '''
          )
          replace_once(
              'src/pyramid.rs',
              '''        let level = self.levels[best_i];
              let first = (start_frame / level.division) as usize;
              let last_exclusive = ((end_frame + level.division - 1) / level.division) as usize;
              let a = first.min(level.peak_count);
          ''',
              '''        let level = self.levels[best_i];
              let first = usize::try_from(start_frame / level.division).unwrap_or(usize::MAX);
              let last_exclusive = usize::try_from(end_frame.div_ceil(level.division))
                  .unwrap_or(usize::MAX);
              let a = first.min(level.peak_count);
          '''
          )
          replace_section(
              'src/pyramid.rs',
              '    pub fn tiles_for_plan(&self, plan: WaveViewPlan) -> Vec<WaveTileKey> {',
              '    pub fn tile(&self, key: WaveTileKey) -> Option<WaveTile> {',
              '''    pub fn tiles_for_plan(&self, plan: WaveViewPlan) -> Vec<WaveTileKey> {
              if plan.peak_count == 0 {
                  return Vec::new();
              }
              let Ok(level_index) = u16::try_from(plan.level_index) else {
                  return Vec::new();
