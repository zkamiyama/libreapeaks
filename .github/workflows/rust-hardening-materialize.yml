              let mut raw = bare_header(1, 1, 48_000);
              raw.extend_from_slice(&TOKEN_LOUDNESS.to_le_bytes());
              raw.extend_from_slice(&1u32.to_le_bytes());
              assert!(ReaPeaks::parse(raw).is_err());
          }

          #[test]
