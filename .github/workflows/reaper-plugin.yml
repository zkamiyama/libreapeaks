name: reaper-rpkx-plugin
on:
  push:
    branches: [feature/reaper-rpkx-preserving-plugin]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Build and fault-test Rust bridge
        shell: bash
        run: |
          set -o pipefail
          mkdir -p plugin-results
          rustc -Vv > plugin-results/rustc.txt
          cargo test --release --manifest-path extensions/reaper_rpkx/Cargo.toml -- --nocapture 2>&1 | tee plugin-results/tests.txt
          cargo build --release --manifest-path extensions/reaper_rpkx/Cargo.toml
      - name: Collect bridge and formatted sources
        if: always()
        shell: bash
        run: |
          cargo fmt --manifest-path extensions/reaper_rpkx/Cargo.toml
          cp extensions/reaper_rpkx/Cargo.lock plugin-results/ || true
          tar -czf plugin-results/bridge-source.tar.gz extensions/reaper_rpkx
          find extensions/reaper_rpkx/target/release -maxdepth 1 -type f \( -name '*rpkx_bridge*' \) -exec cp '{}' plugin-results/ \; || true
      - name: Export Linux development toolchain
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          tar -czf plugin-results/rust-toolchain.tar.gz --exclude='share' --exclude='*.so.debug' -C "$(rustc --print sysroot)" bin lib
          tar -czf plugin-results/cargo-cache.tar.gz -C "$HOME/.cargo" registry
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-bridge-${{ matrix.os }}
          path: plugin-results/
          retention-days: 7
